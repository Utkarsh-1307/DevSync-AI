version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: devsync
      POSTGRES_USER: devsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      target: production
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://devsync:${POSTGRES_PASSWORD}@postgres:5432/devsync
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENVIRONMENT: production
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      target: production
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://devsync:${POSTGRES_PASSWORD}@postgres:5432/devsync
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENVIRONMENT: production
    command: celery -A app.workers.celery_app worker --loglevel=warning -c 4 -Q email,notifications,ai
    depends_on:
      postgres:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      target: production
    restart: always
    env_file: .env.prod
    command: celery -A app.workers.celery_app beat --loglevel=warning
    depends_on:
      - celery_worker

  frontend:
    build:
      context: ./frontend
      target: production
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
